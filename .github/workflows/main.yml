# ------------------------docker compose pipeline for deploy----------


name: CI - Build and Push to ECR CD - Deploy to EC2


on:
 push:
   branches:
    - main


jobs:
 build-and-push:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1


    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Build, Tag, and Push Images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
       # 1. Frontend
       docker build -t $ECR_REGISTRY/frontend:latest ./frontend
       docker push $ECR_REGISTRY/frontend:latest
      
       # 2. Service A
       docker build -t $ECR_REGISTRY/backend-service-a:latest ./serviceA
       docker push $ECR_REGISTRY/backend-service-a:latest


       # 3. Service B
       docker build -t $ECR_REGISTRY/backend-service-b:latest ./serviceB
       docker push $ECR_REGISTRY/backend-service-b:latest


       # 4. Service C
       docker build -t $ECR_REGISTRY/backend-service-c:latest ./serviceC
       docker push $ECR_REGISTRY/backend-service-c:latest


       # 5. Service D
       docker build -t $ECR_REGISTRY/backend-service-d:latest ./serviceD
       docker push $ECR_REGISTRY/backend-service-d:latest


       # 6. Service E
       docker build -t $ECR_REGISTRY/backend-service-e:latest ./serviceE
       docker push $ECR_REGISTRY/backend-service-e:latest


 # THIS MUST BE AT THE SAME INDENT LEVEL AS build-and-push
 deploy:
   runs-on: ubuntu-latest
   needs: build-and-push
   steps:
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Executing remote ssh commands using ssh key
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
         cd ~/TRAFFIC_FLOW
         git pull origin main
         aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 522632170655.dkr.ecr.ap-south-1.amazonaws.com
         sudo docker compose pull
         sudo docker compose up -d
         sudo docker image prune -f






#-----------------------------------------------multi services---------------------
name: CI/CD - Build, Push & Deploy with Nginx Reverse Proxy

on:
  push:
    branches: ["develop"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: servicea
            folder: serviceA
          - service: serviceb
            folder: serviceB
          - service: servicec
            folder: serviceC
          - service: serviced
            folder: serviceD
          - service: servicee
            folder: serviceE
          - service: frontend
            folder: frontend
          - service: nginx
            folder: nginx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          FOLDER: ${{ matrix.folder }}
        run: |
          docker build -t $ECR_REGISTRY/$SERVICE:latest ./$FOLDER
          docker push $ECR_REGISTRY/$SERVICE:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy All to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. ECR Login
            aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            
            # 2. Cleanup
            echo "Cleaning up old containers..."
            sudo docker rm -f frontend servicea serviceb servicec serviced servicee postgres || true
            sudo docker network create appnet || true
            # 3. Database (Postgres)
            sudo docker run -d --name postgres --network appnet -p 5432:5432 \
              -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=microservices \
              --restart always \
              postgres:15
            
            # Database ko initialize hone ke liye thora waqt dena zaroori hai
            echo "Waiting for database to be ready..."
            sleep 15
            # 4. Microservices (Environment variables ke saath)
            
            # Service E
            sudo docker run -d --name servicee --network appnet -p 3005:3005 \
              -e DB_HOST=postgres -e DB_NAME=microservices -e DB_USER=postgres -e DB_PASS=postgres -e DB_PORT=5432 \
              --restart always \
              ${{ secrets.ECR_REGISTRY }}/servicee:latest
            # Service D (Depends on E)
            sudo docker run -d --name serviced --network appnet -p 3004:3004 \
              -e DB_HOST=postgres -e DB_NAME=microservices -e DB_USER=postgres -e DB_PASS=postgres -e DB_PORT=5432 \
              -e SERVICE_E_URL=http://servicee:3005/serviceE \
              --restart always \
              ${{ secrets.ECR_REGISTRY }}/serviced:latest
            # Service C (Depends on D)
            sudo docker run -d --name servicec --network appnet -p 3003:3003 \
              -e DB_HOST=postgres -e DB_NAME=microservices -e DB_USER=postgres -e DB_PASS=postgres -e DB_PORT=5432 \
              -e SERVICE_D_URL=http://serviced:3004/serviceD \
              --restart always \
              ${{ secrets.ECR_REGISTRY }}/servicec:latest
            # Service B (Depends on C)
            sudo docker run -d --name serviceb --network appnet -p 3002:3002 \
              -e DB_HOST=postgres -e DB_NAME=microservices -e DB_USER=postgres -e DB_PASS=postgres -e DB_PORT=5432 \
              -e SERVICE_C_URL=http://servicec:3003/serviceC \
              --restart always \
              ${{ secrets.ECR_REGISTRY }}/serviceb:latest
            # Service A (Depends on B)
            sudo docker run -d --name servicea --network appnet -p 3001:3001 \
              -e DB_HOST=postgres -e DB_NAME=microservices -e DB_USER=postgres -e DB_PASS=postgres -e DB_PORT=5432 \
              -e SERVICE_B_URL=http://serviceb:3002/serviceB \
              --restart always \
              ${{ secrets.ECR_REGISTRY }}/servicea:latest
            # 5. Frontend (Mapped to 8080 for Manual Nginx)
            sudo docker run -d --name frontend --network appnet -p 8080:80 \
              -e REACT_APP_SERVICE_A_URL=http://13.201.9.34/api/servicea/ \
              --restart always \
              ${{ secrets.ECR_REGISTRY }}/frontend:latest
            
            # 6. Final Cleanup
            sudo docker image prune -af
